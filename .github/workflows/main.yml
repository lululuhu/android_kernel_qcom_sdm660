name: Build SDM660 Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig 名称'
        required: true
        default: 'vendor/sdm660-perf_defconfig'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git gnupg gperf \
            libelf-dev libssl-dev libncurses-dev libxml2 libxml2-utils \
            lz4 lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Setup toolchain
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 关键：强制使用 LLVM 工具链
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          make O=out ARCH=arm64 ${{ github.event.inputs.defconfig || 'vendor/sdm660-perf_defconfig' }}

          ./scripts/config --file out/.config -e SECTION_MISMATCH_WARN_ONLY
          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Copy kernel image to AnyKernel3
        run: |
          KERNEL_DIR=kernel/out/arch/arm64/boot
          if [ -f "$KERNEL_DIR/Image.gz-dtb" ]; then
            cp "$KERNEL_DIR/Image.gz-dtb" AnyKernel3/
          elif [ -f "$KERNEL_DIR/Image.gz" ]; then
            cp "$KERNEL_DIR/Image.gz" AnyKernel3/
          else
            cp "$KERNEL_DIR/Image" AnyKernel3/
          fi
          [ -d "$KERNEL_DIR/dtb" ] && cp -r "$KERNEL_DIR/dtb" AnyKernel3/
          [ -f "$KERNEL_DIR/dtbo.img" ] && cp "$KERNEL_DIR/dtbo.img" AnyKernel3/
          ls -la AnyKernel3/

      - name: Configure anykernel.sh
        working-directory: AnyKernel3
        run: |
          sed -i "s/device.name1=.*/device.name1=QK1801/" anykernel.sh
          sed -i "s/kernel.string=.*/kernel.string=SDM660-Kernel/" anykernel.sh
          cat anykernel.sh | head -30

      - name: Pack AnyKernel3
        working-directory: AnyKernel3
        run: |
          zip -r9 ../AnyKernel3-SDM660.zip ./* -x .git .gitignore ./*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: |
            AnyKernel3-SDM660.zip
            kernel/out/arch/arm64/boot/
          if-no-files-found: warn
